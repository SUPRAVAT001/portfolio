<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Supravat Dash</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <script>
    (function(){var t=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'));})();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      background: var(--bg-primary);
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      opacity: 0.5;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 36px;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Portfolio
    </a>
  </main>

</body>
</html>
